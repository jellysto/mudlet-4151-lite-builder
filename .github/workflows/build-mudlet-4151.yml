name: Build Mudlet 4.15.1 Lite (NSIS Installer)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MUDLET_TAG: Mudlet-4.15.1

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout build config repository
        uses: actions/checkout@v4
        with:
          path: build-config

      - name: Checkout Mudlet 4.15.1 source
        uses: actions/checkout@v4
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_TAG }}
          path: Mudlet
          fetch-depth: 1

      - name: Install MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-multimedia
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-imageformats
            mingw-w64-ucrt-x86_64-qt5-translations
            mingw-w64-ucrt-x86_64-lua51
            mingw-w64-ucrt-x86_64-pcre
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-pugixml
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-yajl
            mingw-w64-ucrt-x86_64-sqlite
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lua51-luafilesystem
            mingw-w64-ucrt-x86_64-lua51-lpeg
            mingw-w64-ucrt-x86_64-lua51-lsqlite3
            mingw-w64-ucrt-x86_64-lua-luarocks
            mingw-w64-ucrt-x86_64-ntldd

      - name: Install extra Lua 5.1 modules (luarocks)
        shell: msys2 {0}
        run: |
          set -e
          export YAJL_DIR=/ucrt64
          export PCRE_DIR=/ucrt64
          export ZIP_DIR=/ucrt64
          export SQLITE_DIR=/ucrt64
          export LUA_INCDIR=/ucrt64/include/lua5.1
          export LUA_LIBDIR=/ucrt64/lib
          luarocks --lua-version=5.1 install lua-yajl  || true
          luarocks --lua-version=5.1 install luautf8   || true
          luarocks --lua-version=5.1 install lua-zip   || true
          luarocks --lua-version=5.1 install lrexlib-pcre || true
          luarocks --lua-version=5.1 install argparse  || true
          luarocks --lua-version=5.1 install lunajson  || true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Apply feature-disable patch + Lua-leak fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python "${{ github.workspace }}\build-config\patches\apply_lite_patch.py" "${{ github.workspace }}\Mudlet"
          if ($LASTEXITCODE -ne 0) { throw "apply_lite_patch.py failed" }

      - name: Build Mudlet (qmake + mingw32-make under UCRT64)
        shell: msys2 {0}
        run: |
          set -e
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          export MINGW_BASE_DIR=/ucrt64
          # Use the MSYS2 branch in mudlet.pro (lua5.1 / include/lua5.1).
          export WITH_MAIN_BUILD_SYSTEM=NO
          # Feature toggles: keep built-in fonts and variable splash screen.
          export WITH_UPDATER=NO
          export WITH_3DMAPPER=NO
          # WITH_OWN_QTKEYCHAIN left enabled on purpose.
          cd "$WS/Mudlet/src"
          qmake-qt5 CONFIG+=release mudlet.pro
          if command -v mingw32-make >/dev/null 2>&1; then
            mingw32-make -j${{ env.NUMBER_OF_PROCESSORS }}
          else
            make -j${{ env.NUMBER_OF_PROCESSORS }}
          fi

      - name: Deploy Qt runtime and non-Qt dependencies
        shell: msys2 {0}
        run: |
          set -e
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          REL="$WS/Mudlet/src/release"
          cd "$REL"

          # Qt runtime + plugins (MSYS2 Qt5 windeployqt).
          windeployqt-qt5 mudlet.exe || true

          # Non-Qt DLLs from MSYS2 /ucrt64/bin.
          for dll in \
            lua51.dll libpcre-1.dll libzip-13.dll zlib1.dll libyajl.dll \
            libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "/ucrt64/bin/$dll" ]; then cp -f "/ucrt64/bin/$dll" .; fi
          done

          # Lua modules (MSYS2 pacman tree + luarocks tree).
          for luadir in /ucrt64/lib/lua/5.1 /ucrt64/lib/luarocks/rocks-5.1; do
            if [ -d "$luadir" ]; then cp -r "$luadir" .; fi
          done

          # Mudlet runtime data.
          cp -r "$WS/Mudlet/mudlet-lua" .
          mkdir -p translations
          cp -r "$WS/Mudlet/translations/lua" translations/ || true
          cp -r "$WS/Mudlet/3rdparty/lcf" . || true
          if [ -f "$WS/Mudlet/LICENSE" ]; then cp "$WS/Mudlet/LICENSE" .; fi
          cp "$WS/Mudlet/README.md" . || true
          mv -f mudlet.exe Mudlet.exe

          (cd "$REL" && zip -r "$WS/mudlet-4.15.1-lite-portable.zip" .)

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ws = "${{ github.workspace }}"
          $nsi = "$ws\build-config\installer\mudlet-4.15.1-lite.nsi"
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }

          $icon = Get-ChildItem -Path "$ws\Mudlet" -Filter "mudlet.ico" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $iconArg = @()
          if ($icon) { $iconArg = @("/DMUI_ICON_OVERRIDE=$($icon.FullName)") }

          Set-Location $ws
          & $makensis /DMUDLET_VERSION=4.15.1 /DRELEASE_DIR="$ws\Mudlet\src\release" @iconArg $nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Upload installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Mudlet-4.15.1-Lite-Windows
          path: |
            ${{ github.workspace }}\Mudlet-4.15.1-Lite-Setup.exe
            ${{ github.workspace }}\mudlet-4.15.1-lite-portable.zip
          if-no-files-found: error
