name: Build Mudlet 4.15.1 Lite (NSIS Installer)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MUDLET_TAG: Mudlet-4.15.1

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout build config repository
        uses: actions/checkout@v4
        with:
          path: build-config

      - name: Checkout Mudlet 4.15.1 source
        uses: actions/checkout@v4
        with:
          repository: Mudlet/Mudlet
          ref: ${{ env.MUDLET_TAG }}
          path: Mudlet
          fetch-depth: 1

      - name: Install MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-multimedia
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-imageformats
            mingw-w64-ucrt-x86_64-qt5-translations
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-lua51
            mingw-w64-ucrt-x86_64-pcre
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-pugixml
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-yajl
            mingw-w64-ucrt-x86_64-sqlite
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lua51-luafilesystem
            mingw-w64-ucrt-x86_64-lua51-lpeg
            mingw-w64-ucrt-x86_64-lua51-lsqlite3
            mingw-w64-ucrt-x86_64-lua-luarocks
            mingw-w64-ucrt-x86_64-ntldd

      - name: Install extra Lua 5.1 modules (luarocks)
        shell: msys2 {0}
        run: |
          set -e
          export YAJL_DIR=/ucrt64
          export PCRE_DIR=/ucrt64
          export ZIP_DIR=/ucrt64
          export SQLITE_DIR=/ucrt64
          export LUA_INCDIR=/ucrt64/include/lua5.1
          export LUA_LIBDIR=/ucrt64/lib
          # Install into the system tree so modules land in /ucrt64/lib/lua/5.1
          # alongside the pacman modules, making deployment a single copy.
          luarocks --lua-version=5.1 --tree=/ucrt64 install lua-yajl  || true
          luarocks --lua-version=5.1 --tree=/ucrt64 install luautf8   || true
          luarocks --lua-version=5.1 --tree=/ucrt64 install lua-zip   || true
          luarocks --lua-version=5.1 --tree=/ucrt64 install lrexlib-pcre || true
          luarocks --lua-version=5.1 --tree=/ucrt64 install luasql-sqlite3 || true
          luarocks --lua-version=5.1 --tree=/ucrt64 install argparse  || true
          luarocks --lua-version=5.1 --tree=/ucrt64 install lunajson  || true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Apply feature-disable patch + Lua-leak fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python "${{ github.workspace }}\build-config\patches\apply_lite_patch.py" "${{ github.workspace }}\Mudlet"
          if ($LASTEXITCODE -ne 0) { throw "apply_lite_patch.py failed" }

      - name: Build Mudlet (qmake + mingw32-make under UCRT64)
        shell: msys2 {0}
        run: |
          set -e
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          export MINGW_BASE_DIR=/ucrt64
          # Use the MSYS2 branch in mudlet.pro (lua5.1 / include/lua5.1).
          export WITH_MAIN_BUILD_SYSTEM=NO
          # Feature toggles: keep built-in fonts and variable splash screen.
          export WITH_UPDATER=NO
          export WITH_3DMAPPER=NO
          # WITH_OWN_QTKEYCHAIN left enabled on purpose.
          # MSYS2 names Qt5 tools with a -qt5 suffix, but the generated Makefile
          # hardcodes bare names (lrelease.exe/lupdate.exe). Provide aliases so
          # translation .qm files get built (otherwise qrc_qm.cpp fails).
          for tool in lrelease lupdate; do
            if [ -f "/ucrt64/bin/${tool}-qt5.exe" ] && [ ! -f "/ucrt64/bin/${tool}.exe" ]; then
              cp -f "/ucrt64/bin/${tool}-qt5.exe" "/ucrt64/bin/${tool}.exe"
            fi
          done
          cd "$WS/Mudlet/src"
          qmake-qt5 CONFIG+=release mudlet.pro
          # Single-threaded build: Mudlet's huge files compiled with -O3 exhaust
          # the runner's 7GB RAM even at -j2 (cc1plus is killed silently).
          if command -v mingw32-make >/dev/null 2>&1; then
            mingw32-make -j1
          else
            make -j1
          fi

      - name: Deploy Qt runtime and non-Qt dependencies
        continue-on-error: true
        shell: msys2 {0}
        run: |
          # No `set -e`: this step is best-effort DLL/data copying. Individual
          # probes (ntldd/grep/windeployqt) may return non-zero on optional items
          # and must not abort the whole deployment. Final checks guard output.
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          REL="$WS/Mudlet/src/release"
          cd "$REL"

          # Copy ALL DLLs from /ucrt64/bin. ntldd -R kept missing transitive
          # deps (e.g. libfreetype-6.dll required by platforms/qwindows.dll),
          # causing "no Qt platform plugin could be initialized". Bringing the
          # whole runtime is bulletproof; the extra size is acceptable.
          cp -f /ucrt64/bin/*.dll . 2>/dev/null || true

          # Ensure the specific libs the Qt platform plugin needs are present
          # (belt-and-braces, in case the glob above is affected by shell limits).
          for dll in libfreetype-6.dll libharfbuzz-0.dll libmd4c.dll \
            libpng16-16.dll libdouble-conversion.dll libicuin78.dll libicuuc78.dll \
            libpcre2-16-0.dll libzstd.dll libz-1.dll libsqlite3-0.dll \
            lua51.dll libpcre-1.dll libzip-13.dll zlib1.dll libyajl.dll \
            libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "/ucrt64/bin/$dll" ]; then cp -f "/ucrt64/bin/$dll" .; fi
          done

          # Lua modules: Mudlet's default package.cpath searches ".\?.dll"
          # (the exe's own directory) and "../lib/lua/5.1". Flatten all module
          # DLLs into the release root so ".\?.dll" finds them, and also keep
          # the standard lib/lua/5.1 + share/lua/5.1 subtrees.
          if [ -d /ucrt64/lib/lua/5.1 ]; then
            find /ucrt64/lib/lua/5.1 -type f -name '*.dll' -exec cp -f {} . \;
            mkdir -p lib/lua/5.1
            cp -r /ucrt64/lib/lua/5.1/. lib/lua/5.1/
            # Dotted modules (e.g. luasql.sqlite3 -> luasql/sqlite3.dll): keep
            # subdir tree directly under the exe directory too.
            for sub in /ucrt64/lib/lua/5.1/*/; do
              [ -d "$sub" ] && cp -r "$sub" .
            done
          fi
          if [ -d /ucrt64/share/lua/5.1 ]; then
            mkdir -p share/lua/5.1
            cp -r /ucrt64/share/lua/5.1/. share/lua/5.1/
          fi
          # Lua pure-script modules (argparse, lunajson, re.lua, etc.) next to exe.
          find /ucrt64/share/lua/5.1 -type f -name '*.lua' -exec cp -f {} . \; 2>/dev/null || true

          # Copy transitive dependencies of ALL Lua module DLLs (ntldd -R on
          # mudlet.exe does not see DLLs loaded at runtime via require()).
          find . -maxdepth 2 -type f -name '*.dll' | while IFS= read -r modll; do
            ntldd "$modll" 2>/dev/null \
              | grep -iE 'ucrt64[/\\]bin' \
              | sed -n 's/.*=>[[:space:]]*\([^[:space:]]*\.dll\).*/\1/p' \
              | sort -u \
              | while IFS= read -r depdll; do
                  msys_dep=$(cygpath -u "$depdll" 2>/dev/null || printf '%s' "$depdll")
                  if [ -f "$msys_dep" ]; then cp -f "$msys_dep" .; fi
                done
          done

          # Mudlet runtime data. Note: in 4.15.1 the Lua scripts live at
          # src/mudlet-lua (not the repository root).
          cp -r "$WS/Mudlet/src/mudlet-lua" .
          mkdir -p translations
          cp -r "$WS/Mudlet/translations/lua" translations/ || true
          cp -r "$WS/Mudlet/3rdparty/lcf" . || true
          # NSIS MUI_PAGE_LICENSE needs a LICENSE file in the release dir.
          if [ -f "$WS/Mudlet/LICENSE" ]; then
            cp "$WS/Mudlet/LICENSE" .
          elif [ -f "$WS/Mudlet/COPYING" ]; then
            cp "$WS/Mudlet/COPYING" LICENSE
          else
            printf 'Mudlet 4.15.1 Lite - GPLv3 custom build.\nSee https://www.gnu.org/licenses/gpl-3.0.html\n' > LICENSE
          fi
          cp "$WS/Mudlet/README.md" . || true
          mv -f mudlet.exe Mudlet.exe

          # Report-only: any DLL ntldd could not resolve. Most are Windows
          # system API-sets provided at runtime; real 3rd-party DLLs were
          # copied above. Not fatal by design.
          ntldd -R Mudlet.exe 2>/dev/null | grep -i "not found" || true

          # Qt plugins: copy the whole plugin tree explicitly (do NOT rely on
          # windeployqt -- it can fail after exe rename). platforms/qwindows.dll
          # is required or Qt reports "no platform plugin could be initialized".
          if [ -d /ucrt64/share/qt5/plugins ]; then
            cp -r /ucrt64/share/qt5/plugins/. .
            # qwindows.dll and friends depend on more DLLs; scan them all.
            find . -type f -path './*/*.dll' | while IFS= read -r pdl; do
              ntldd "$pdl" 2>/dev/null \
                | grep -iE 'ucrt64[/\\]bin' \
                | sed -n 's/.*=>[[:space:]]*\([^[:space:]]*\.dll\).*/\1/p' \
                | sort -u \
                | while IFS= read -r depdll; do
                    msys_dep=$(cygpath -u "$depdll" 2>/dev/null || printf '%s' "$depdll")
                    if [ -f "$msys_dep" ]; then cp -f "$msys_dep" .; fi
                  done
            done
          fi
          windeployqt-qt5 Mudlet.exe || true

          # Best-effort step: only fail here if the main executable is missing.
          if [ ! -f "$REL/Mudlet.exe" ]; then
            echo "ERROR: Mudlet.exe not found in release dir" >&2
            exit 1
          fi
          echo "Deployment complete: $(find "$REL" -type f | wc -l) files"
          exit 0

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ws = "${{ github.workspace }}"
          $nsi = "$ws\build-config\installer\mudlet-4.15.1-lite.nsi"
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }

          # MUI_PAGE_LICENSE needs a real LICENSE file in the release dir.
          # Create it here (authoritative) so NSIS never fails on a missing one.
          $relDir = "$ws\Mudlet\src\release"
          $license = "$relDir\LICENSE"
          if (-not (Test-Path $license)) {
            @("Mudlet 4.15.1 Lite - GPLv3 custom build.",
              "See https://www.gnu.org/licenses/gpl-3.0.html") | Set-Content -Path $license -Encoding UTF8
          }

          $icon = Get-ChildItem -Path "$ws\Mudlet" -Filter "mudlet.ico" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $iconArg = @()
          if ($icon) { $iconArg = @("/DMUI_ICON_OVERRIDE=$($icon.FullName)") }

          $setup = "$ws\Mudlet-4.15.1-Lite-Setup.exe"
          Set-Location $ws
          & $makensis /DMUDLET_VERSION=4.15.1 /DRELEASE_DIR="$ws\Mudlet\src\release" "/DSETUP_OUTPUT=$setup" @iconArg $nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          if (-not (Test-Path $setup)) { throw "NSIS did not produce expected installer: $setup" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mudlet-4.15.1-Lite-Windows
          path: ${{ github.workspace }}\Mudlet-4.15.1-Lite-Setup.exe
          if-no-files-found: error
